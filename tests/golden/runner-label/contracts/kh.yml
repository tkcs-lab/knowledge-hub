name: kh

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        type: string
        required: false

jobs:
  validate:
    if: github.event_name == 'pull_request_target'
    runs-on: kh-validate-contracts
    steps:
      - name: kh validate
        env:
          REPO: ${{ github.event.repository.name }}
          ORG: ${{ github.repository_owner }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FORGEJO_URL: ${{ vars.KH_FORGEJO_URL || github.server_url }}
          GRIST_URL: ${{ vars.KH_GRIST_URL }}
          GRIST_DOC: ${{ vars.KH_GRIST_DOC_ID }}
          CI_TOKEN: ${{ secrets.KH_CI_TOKEN }}
          GRIST_KEY: ${{ secrets.KH_CI_GRIST_KEY }}
          STATUS_TOKEN: ${{ secrets.KH_CI_STATUS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf %s "$CI_TOKEN" > "$dir/token"
          printf %s "$GRIST_KEY" > "$dir/grist"
          extra=()
          if [ -n "$STATUS_TOKEN" ]; then
            printf %s "$STATUS_TOKEN" > "$dir/status"
            extra+=(--status-token-file "$dir/status")
          fi
          kh validate --repo "$REPO" --forgejo-org "$ORG" --base "$BASE" --head "$HEAD" --forgejo-url "$FORGEJO_URL" --token-file "$dir/token" --grist-url "$GRIST_URL" --grist-key-file "$dir/grist" --grist-doc-id "$GRIST_DOC" ${extra[@]+"${extra[@]}"}

  domain-owners:
    runs-on: kh-validate-contracts
    steps:
      - name: kh domain-owners
        env:
          REPO: ${{ github.event.repository.name }}
          ORG: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          FORGEJO_URL: ${{ vars.KH_FORGEJO_URL || github.server_url }}
          CI_TOKEN: ${{ secrets.KH_CI_TOKEN }}
          STATUS_TOKEN: ${{ secrets.KH_CI_STATUS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf %s "$CI_TOKEN" > "$dir/token"
          extra=()
          if [ -n "$STATUS_TOKEN" ]; then
            printf %s "$STATUS_TOKEN" > "$dir/status"
            extra+=(--status-token-file "$dir/status")
          fi
          kh domain-owners --repo "$REPO" --forgejo-org "$ORG" --pr "$PR" --forgejo-url "$FORGEJO_URL" --token-file "$dir/token" ${extra[@]+"${extra[@]}"}
