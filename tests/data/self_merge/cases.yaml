# Shared self-merge cases (plan 3.8). The trust walk reads `trust`; kh domain-owners (p6) reads
# `domain_owners`. Fields: author, merger, teams (team -> members), self_merge_teams, bots (extra
# bot logins), files (paths the PR changes), deleted (paths it removes), base_files (paths that exist
# before it), owners_change (owners.yml text the PR commits), owners_root ("missing" for none),
# approvals (logins), labels, author_id, merger_id, head_mismatch, no_pr, history (earlier merges:
# files, owners_change, approved, merger, author), judged (false: no stored verdict), trust, domain_owners,
# ci_gap (why CI cannot agree with the walk).
x-teams: &teams
  kh-portfolio: [alice, erin]
  kh-product: [carol]
  kh-technical: [frank]
  kh-admins: [dave]
  kh-hub-bot: []

x-owners-moved: &owners_moved |
  version: 1
  audience: all
  domains: {portfolio: kh-portfolio, product: kh-portfolio, technical: kh-technical}
  rules:
    - {team: kh-admins, paths: [".forgejo/**", "schema/**", owners.yml, CODEOWNERS, glossary.md]}
    - {team: kh-portfolio, paths: ["portfolio/**"]}
    - {team: kh-portfolio, paths: ["product/**"]}
    - {team: kh-technical, paths: ["technical/**"]}
    - {team: kh-admins, paths: ["**"]}

x-owners-moved-touched: &owners_moved_touched |
  # touched
  version: 1
  audience: all
  domains: {portfolio: kh-portfolio, product: kh-portfolio, technical: kh-technical}
  rules:
    - {team: kh-admins, paths: [".forgejo/**", "schema/**", owners.yml, CODEOWNERS, glossary.md]}
    - {team: kh-portfolio, paths: ["portfolio/**"]}
    - {team: kh-portfolio, paths: ["product/**"]}
    - {team: kh-technical, paths: ["technical/**"]}
    - {team: kh-admins, paths: ["**"]}

x-owners-grab: &owners_grab |
  version: 1
  audience: all
  domains: {portfolio: kh-portfolio, product: kh-product, technical: kh-technical}
  rules:
    - {team: kh-portfolio, paths: [".forgejo/**", "schema/**", owners.yml, CODEOWNERS, glossary.md]}
    - {team: kh-portfolio, paths: ["portfolio/**"]}
    - {team: kh-product, paths: ["product/**"]}
    - {team: kh-technical, paths: ["technical/**"]}
    - {team: kh-admins, paths: ["**"]}

cases:
  - name: owner-self-merge-in-own-domain
    author: alice
    merger: alice
    teams: *teams
    self_merge_teams: [kh-portfolio]
    files: [portfolio/a.md]
    trust: owner_merge
    domain_owners: pass

  - name: one-path-of-another-team
    author: alice
    merger: alice
    teams: *teams
    self_merge_teams: [kh-portfolio, kh-product]
    files: [portfolio/a.md, product/b.md]
    trust: disputed
    domain_owners: fail

  - name: team-not-in-self-merge-teams
    author: alice
    merger: alice
    teams: *teams
    self_merge_teams: [kh-product]
    files: [portfolio/a.md]
    trust: disputed
    domain_owners: fail

  - name: someone-else-merged
    author: alice
    merger: zed
    teams: *teams
    self_merge_teams: [kh-portfolio]
    files: [portfolio/a.md]
    trust: disputed
    domain_owners: pass
    ci_gap: another person merged the pull request, which CI cannot know

  - name: hub-bot-merged-by-hub-bot
    author: kh-hub-bot
    merger: kh-hub-bot
    teams:
      kh-portfolio: [kh-hub-bot]
    self_merge_teams: [kh-portfolio]
    files: [portfolio/a.md]
    trust: disputed
    domain_owners: fail

  - name: configured-bot
    author: release-bot
    merger: release-bot
    bots: [release-bot]
    teams:
      kh-portfolio: [release-bot]
    self_merge_teams: [kh-portfolio]
    files: [portfolio/a.md]
    trust: disputed
    domain_owners: fail

  - name: owners-missing-at-parent
    author: alice
    merger: alice
    teams: *teams
    self_merge_teams: [kh-portfolio]
    owners_root: missing
    files: [portfolio/a.md]
    trust: disputed
    domain_owners: error

  - name: owners-edit-is-judged-by-the-old-file
    author: alice
    merger: alice
    teams: *teams
    self_merge_teams: [kh-portfolio, kh-admins]
    owners_change: *owners_grab
    files: [portfolio/a.md]
    trust: disputed
    domain_owners: fail

  - name: governance-path-with-admins-in-self-merge-teams
    author: dave
    merger: dave
    teams: *teams
    self_merge_teams: [kh-admins]
    files: [glossary.md]
    trust: owner_merge
    domain_owners: pass

  - name: governance-path-without-admins-in-self-merge-teams
    author: dave
    merger: dave
    teams: *teams
    self_merge_teams: [kh-portfolio]
    files: [glossary.md]
    trust: disputed
    domain_owners: fail

  - name: non-owner-approval-without-self-merge
    author: alice
    merger: alice
    teams: *teams
    self_merge_teams: [kh-portfolio]
    files: [product/b.md]
    approvals: [bob]
    trust: reviewed
    domain_owners: fail

  - name: bot-promotion-with-human-approval
    author: kh-hub-bot
    merger: kh-hub-bot
    teams: *teams
    self_merge_teams: [kh-portfolio]
    files: [portfolio/a.md]
    approvals: [erin]
    trust: reviewed
    domain_owners: pass

  - name: bot-promotion-without-approval
    author: kh-hub-bot
    merger: kh-hub-bot
    teams: *teams
    self_merge_teams: [kh-portfolio]
    files: [portfolio/a.md]
    trust: disputed
    domain_owners: fail

  - name: empty-self-merge-teams
    author: alice
    merger: alice
    teams: *teams
    self_merge_teams: []
    files: [portfolio/a.md]
    trust: disputed
    domain_owners: fail

  - name: rename-from-another-teams-path
    author: carol
    merger: carol
    teams: *teams
    self_merge_teams: [kh-portfolio, kh-product]
    base_files: [portfolio/a.md]
    files: [product/a.md]
    deleted: [portfolio/a.md]
    trust: disputed
    domain_owners: fail

  - name: disputed-owners-edit-then-self-merge
    author: alice
    merger: alice
    teams: *teams
    self_merge_teams: [kh-portfolio]
    history:
      - {author: zed, merger: zed, approved: false, owners_change: *owners_moved}
    files: [product/b.md]
    trust: disputed
    domain_owners: pass
    ci_gap: the rules were changed by a merge that was not trusted, which CI cannot know

  - name: owners-edit-trusted-later
    author: alice
    merger: alice
    teams: *teams
    self_merge_teams: [kh-portfolio]
    history:
      - {author: zed, merger: zed, approved: false, owners_change: *owners_moved}
      - {author: zed, merger: zed, approved: true, owners_change: *owners_moved_touched}
    files: [product/b.md]
    trust: owner_merge
    domain_owners: pass

  - name: second-parent-is-not-the-pr-head
    author: alice
    merger: alice
    teams: *teams
    self_merge_teams: [kh-portfolio]
    head_mismatch: true
    files: [portfolio/a.md]
    trust: disputed
    domain_owners: pass
    ci_gap: the merge commit is not a merge of the pull request head, which CI cannot know

  - name: widen-audience-label
    author: alice
    merger: alice
    teams: *teams
    self_merge_teams: [kh-portfolio]
    labels: [widen-audience/hr]
    files: [portfolio/a.md]
    trust: disputed
    domain_owners: fail

  - name: pull-request-unknown-to-forgejo
    author: alice
    merger: alice
    teams: *teams
    self_merge_teams: [kh-portfolio]
    no_pr: true
    judged: false
    files: [portfolio/a.md]
    trust: disputed
    domain_owners: pass
    ci_gap: the walk found no merged pull request, which CI cannot know

  - name: login-case-differs
    author: alice
    merger: Alice
    teams: *teams
    self_merge_teams: [kh-portfolio]
    files: [portfolio/a.md]
    trust: owner_merge
    domain_owners: pass

  - name: ids-zero-with-different-logins
    author: alice
    merger: zed
    author_id: 0
    merger_id: 0
    teams: *teams
    self_merge_teams: [kh-portfolio]
    files: [portfolio/a.md]
    trust: disputed
    domain_owners: pass
    ci_gap: another person merged the pull request, which CI cannot know

  - name: ghost-merger
    author: alice
    merger: Ghost
    merger_id: -1
    teams: *teams
    self_merge_teams: [kh-portfolio]
    files: [portfolio/a.md]
    trust: disputed
    domain_owners: pass
    ci_gap: the merger is a deleted account, which CI cannot know
