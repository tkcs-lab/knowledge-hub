# repo-admin policy of the knowledge-hub repository (playbook: repo-admin).
# Only the sections below are managed; every other section of the starter is left out on purpose.
# Audit with an owner token (run where one exists, never in chat):
#   tld ops repo-admin audit --policy .tld/admin-policy.yaml

org: tkcs-lab
repos:
  include: ["knowledge-hub"]
  skip_archived: true
  skip_forks: true

repo_settings:
  delete_branch_on_merge: true
  allow_update_branch: true
  allow_auto_merge: true
  has_wiki: false
  has_projects: false

security:
  vulnerability_alerts: true
  automated_security_fixes: true
  secret_scanning: true
  secret_push_protection: true
  private_vulnerability_reporting: true

actions:
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false

rulesets:
  default_branch:
    required_status_checks: []     # fill in the CI job names once the repository has a CI workflow
    admin_bypass: true             # the owner (admin role) may merge through a pull request; the agent (write) cannot
  tags: true                       # only the admin role creates or moves tags; the release workflow uses TLD_RELEASE_TOKEN

agent:
  agent_login: andras-tkcs-agent
  branch_policy: default_branch

release:
  reviewer_login: andras-tkcs      # the owner who approves each release run
  environment: release             # the environment name release.yml already uses (`environment: release`)

secrets:
  required: ["TLD_RELEASE_TOKEN"]  # release.yml creates the tag and release with it; reported where missing
  keep: ["TLD_RELEASE_TOKEN"]
  delete_unused: false

config_dirs:
  require: [LICENSE, SECURITY.md, .github/CODEOWNERS]

workflow_lint:
  pin_actions: third_party
  require_permissions: true
  forbid_pull_request_target: true
