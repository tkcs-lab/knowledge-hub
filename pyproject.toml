[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-hub"
dynamic = ["version"]
description = "Trusted core of the company knowledge layer"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "starlette",
    "uvicorn",
    "psycopg[binary,pool]",
    "pgvector",
    "PyJWT[crypto]",
    "cryptography",
    "httpx",
    "pyyaml",
    "pydantic-settings",
    "boto3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff==0.17.5"]

[project.scripts]
kh = "knowledge_hub.cli:main"

[tool.setuptools.dynamic]
version = {attr = "knowledge_hub.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_hub = ["migrations/*.sql", "governance/templates/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: tests that need no external services",
    "integration: tests that need a database or the installed package",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
