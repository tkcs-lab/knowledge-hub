# Example kh.yaml (mounted from a directory at the path in KH_CONFIG_FILE and read by `kh setup`).
# Values for org, bot_login and indexer_login are the defaults.
org: kh                       # Forgejo organisation
bot_login: kh-bot             # opens every T0 pull request and is stamped on every T3 record
indexer_login: kh-indexer     # read-only token owner
forgejo_web_url: null         # for example https://forgejo.example.com, used for source links
hub_url: http://knowledge-hub:8080   # how Forgejo reaches the hub; only `kh setup` needs it
# Forgejo login -> the email the sign-in verifies for that person. Every group member needs an entry.
# Directory groups (Google or Keycloak): people who sign in with a domain address get their
# groups from a snapshot written by `kh directory sync`. Everything here stays commented out.
# directory:
#   provider: google          # none | google | keycloak
#   domains: [example.com]    # lower-case email domains a person may have
#   refresh_seconds: 300
people:
  alice: alice@example.com
  bob: bob@example.com
groups:
  all:
    repo: kb-all              # default: kb-<group>
    members: [alice, bob]
    approvers: [alice]        # non-empty subset of members
#     directory:              # references per provider; switching is `directory.provider` only
#       google:   {members: [kh-all@example.com], approvers: [kh-all-approvers@example.com]}
#       keycloak: {members: [kh-all], approvers: [kh-all-approvers]}
#     slack_channel: "#kh-all-approvers"   # optional: Slack hook on the repo for pull requests; URL in KH_SETUP_SLACK_WEBHOOKS_FILE
  mgmt:
    members: [alice]
    approvers: [alice]
#     archived: true          # hides the group; nothing is deleted
labels:
  product:ember: Ember product
  topic:onboarding: Onboarding material
# archived_labels: [topic:onboarding]   # hides a label; each entry must be a key of labels
# Technical repos (tier T0a: indexed without review, audience all; needs the group all).
# The clone or fork is created by hand in tech_org; `kh setup` only checks it.
# tech_org: kh-tech           # Forgejo org of the clones; must differ from org
# tech_repos:
#   ember-core:               # bare repository name in tech_org
#     labels: [product:ember] # optional; each must be a key of labels
