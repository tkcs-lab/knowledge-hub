# PrivacyFence upstream declaration for the knowledge hub (docs/upstream-mcp.md in PrivacyFence).
# Set PRIVACYFENCE_UPSTREAM_MCP_FILE on the PrivacyFence container to this file and restart it: the
# declaration is read once at startup, and so is the hub's tool list. The tool names are the ones
# `register_tools` registers (tests/unit/test_privacyfence_declaration.py checks that).
# A new tool needs PrivacyFence restarted and the tool allowed on each Claude connection.
# Reads are `auto`, writes are `popup`. `audience` must equal KH_PF_AUDIENCE. PrivacyFence reaches the hub over the
# private `pf-kh` network. Changing a tool's gate, verb or effect, or the url, audience or claim mode,
# voids the approvals of existing n8n tokens (PrivacyFence ADR 0300): create those tokens again.
# A person's groups come from `people:` in kh.yaml through the verified email in the claim; people need
# no entry in PrivacyFence's group map.
# Audiences come from the hub: PrivacyFence calls list_audiences (audiences_tool) itself with a service
# claim at startup and every audiences_refresh_seconds, and the answer lists the members' `people` emails
# of each active kh.yaml group. So PrivacyFence needs no upstream_mcp.kh.groups map in admin_config.json
# (one that exists is ignored) and no membership source for this upstream, and no addition is approved.
# An n8n token's audiences are its creator's hub groups at each call, intersected with the ones ticked
# when the token was made (PrivacyFence ADR 0298), so whoever creates an n8n token is a member of those
# groups in kh.yaml. A change to kh.yaml reaches PrivacyFence after `kh serve` restarts and within one
# refresh interval. audiences_tool needs a PrivacyFence release that knows the key (ADR 0325); an older
# one refuses this file, so upgrade PrivacyFence first. The source is not in the declaration digest:
# existing n8n tokens stay valid.
# email_for_visibility lets PrivacyFence put the verified email in the claim; without it no person's claim carries an email, so no person holds any group.
version: 1
upstreams:
  - id: kh
    label: Knowledge hub
    url: http://knowledge-hub:8080/mcp
    audience: knowledge-hub
    identity_claim: required
    email_for_visibility: true
    audiences_tool: list_audiences
    audiences_refresh_seconds: 300
    allowed_principal_types: [claude_client, n8n_workflow]
    tools:
      search:
        gate: auto
        verb: search
      get_doc:
        gate: auto
        verb: read
      list_stale:
        gate: auto
        verb: read
      list_labels:
        gate: auto
        verb: read
      usage:
        gate: auto
        verb: read
      ingest_record:
        gate: popup
        verb: add
        effect: Stores a raw record readable by the named group.
      mark_record_outdated:
        gate: popup
        verb: update
        effect: Marks a raw record of your group as outdated, or as current again.
      propose_doc:
        gate: popup
        verb: update
        effect: Opens a pull request that proposes a document change.
      move_item:
        gate: popup
        verb: move
        effect: Moves a record at once, or opens two pull requests that move a document, between two groups you hold; not a purge.
