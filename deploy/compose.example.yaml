# Secrets are files under /run/secrets; this file holds no secret value.
# Every kh container (knowledge-hub, -directory, -panel) must run the same image tag.
# `kh serve` exits with code 75 when kh.yaml changes; `restart: unless-stopped` brings it back.
services:
  knowledge-hub:
    # The release image (linux/arm64). Pin the digest in the stack:
    #   docker buildx imagetools inspect ghcr.io/tkcs-lab/knowledge-hub:0.6.0
    image: ghcr.io/tkcs-lab/knowledge-hub:0.6.0
    restart: unless-stopped
    networks: [db, kh, egress]   # egress only for the sign-in: restrict it to the issuer's hosts by name
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      KH_ENV: prod
      KH_ALLOWED_HOSTS: "knowledge-hub:8080"   # add the public host when KH_PUBLIC_URL is set
      # Sign-in and OAuth: all four or none (docs/runbook-identity.md).
      # KH_PUBLIC_URL: "https://kh.example.com"
      # KH_OIDC_ISSUER: "https://accounts.google.com"
      # KH_OIDC_CLIENT_ID: "example-client-id.apps.example.com"
      # KH_OIDC_ALLOWED_DOMAINS: "example.com"
      # KH_OIDC_HOSTED_DOMAINS: "example.com"
      # KH_OIDC_CLIENT_SECRET_FILE: /run/secrets/kh_oidc_client_secret   # OAuth is on only when all of these are set
      KH_DB_HOST: postgres
      KH_DB_NAME: kh
      KH_DB_MIGRATOR_PASSWORD_FILE: /run/secrets/pg_kh_migrator
      KH_DB_APP_PASSWORD_FILE: /run/secrets/pg_kh_app
      KH_DB_INDEXER_PASSWORD_FILE: /run/secrets/pg_kh_indexer
      KH_CONFIG_FILE: /etc/kh/kh.yaml
      KH_FORGEJO_URL: "http://forgejo:3000"
      KH_FORGEJO_BOT_TOKEN_FILE: /run/secrets/kh_hub_bot_token
      KH_FORGEJO_INDEXER_TOKEN_FILE: /run/secrets/kh_indexer_token
      KH_WEBHOOK_HMAC_FILE: /run/secrets/kh_webhook_hmac
      KH_EMBED_PROVIDER: ollama
      KH_OLLAMA_URL: "http://ollama:11434"
      KH_S3_ENDPOINT: "http://garage:3900"
      KH_S3_BUCKET: kh-blobs
      KH_S3_ACCESS_KEY_FILE: /run/secrets/kh_s3_access_key
      KH_S3_SECRET_KEY_FILE: /run/secrets/kh_s3_secret_key
      KH_CURSOR_KEY_FILE: /run/secrets/kh_cursor_key
      KH_METRICS_TOKEN_FILE: /run/secrets/kh_metrics_token
      KH_PROPOSE_MAX_BYTES: "131072"
      KH_PROPOSE_MAX_OPEN: "20"
      KH_SEARCH_MIN_SIMILARITY: "0"   # off; calibrate per docs/runbook.md "Calibrating the search similarity floor"
    secrets:
      - pg_kh_migrator
      - pg_kh_app
      - pg_kh_indexer
      - kh_hub_bot_token
      - kh_indexer_token
      - kh_webhook_hmac
      - kh_s3_access_key
      - kh_s3_secret_key
      - kh_cursor_key
      - kh_metrics_token
      - kh_oidc_client_secret
    volumes:
      - ./config:/etc/kh:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read().strip()==b'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The directory sync: the only container that holds a directory credential and the only one that
  # reaches the provider (docs/runbook-identity.md). Start it only when `directory.provider` is set.
  # With directory.provider: none the command exits 0 and restart: unless-stopped restarts it in a loop, so start it only when a provider is set.
  knowledge-hub-directory:
    image: ghcr.io/tkcs-lab/knowledge-hub:0.6.0   # the same image and tag as knowledge-hub
    restart: unless-stopped
    command: ["directory", "sync", "--every", "300"]
    networks: [db, egress]   # egress: outbound to the provider's hosts only (for Keycloak use its internal admin network instead)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      KH_ENV: prod
      KH_DB_HOST: postgres
      KH_DB_NAME: kh
      KH_DB_INDEXER_PASSWORD_FILE: /run/secrets/pg_kh_indexer
      KH_CONFIG_FILE: /etc/kh/kh.yaml
      KH_DIRECTORY_GOOGLE_CREDENTIALS_FILE: /run/secrets/kh_directory_google_key
      # KH_DIRECTORY_GOOGLE_SUBJECT: "kh-directory-reader@example.com"   # required for the google provider
      KH_DIRECTORY_KEYCLOAK_CLIENT_SECRET_FILE: /run/secrets/kh_directory_keycloak_secret
      # KH_DIRECTORY_KEYCLOAK_URL: "http://keycloak:8080"
      # KH_DIRECTORY_KEYCLOAK_REALM: "example"
      # KH_DIRECTORY_KEYCLOAK_CLIENT_ID: "kh-directory"
    secrets:
      - pg_kh_indexer
      - kh_directory_google_key
      - kh_directory_keycloak_secret
    volumes:
      - ./config:/etc/kh:ro

  # The admin panel. Publish it only to a private network or behind an access proxy: there is no
  # `ports:` entry on purpose. Only the emails in `admins:` of kh.yaml may sign in.
  knowledge-hub-panel:
    image: ghcr.io/tkcs-lab/knowledge-hub:0.6.0   # the same image and tag as knowledge-hub
    restart: unless-stopped
    command: ["panel", "serve", "--port", "8081"]
    networks: [db, kh, egress]   # egress only for the sign-in issuer: restrict it to the issuer's hosts by name
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      KH_ENV: prod
      # The variables `kh check` and `kh setup plan` need (run by the panel as subprocesses):
      # KH_DB_*, KH_CONFIG_FILE, KH_FORGEJO_*, KH_WEBHOOK_HMAC_FILE, KH_EMBED_PROVIDER, KH_OLLAMA_URL,
      # KH_S3_*, KH_CURSOR_KEY_FILE and KH_SETUP_*.
      KH_DB_HOST: postgres
      KH_DB_NAME: kh
      KH_DB_MIGRATOR_PASSWORD_FILE: /run/secrets/pg_kh_migrator
      KH_DB_APP_PASSWORD_FILE: /run/secrets/pg_kh_app
      KH_DB_INDEXER_PASSWORD_FILE: /run/secrets/pg_kh_indexer
      KH_CONFIG_FILE: /etc/kh/kh.yaml
      KH_FORGEJO_URL: "http://forgejo:3000"
      KH_FORGEJO_BOT_TOKEN_FILE: /run/secrets/kh_hub_bot_token
      KH_FORGEJO_INDEXER_TOKEN_FILE: /run/secrets/kh_indexer_token
      KH_WEBHOOK_HMAC_FILE: /run/secrets/kh_webhook_hmac
      KH_EMBED_PROVIDER: ollama
      KH_OLLAMA_URL: "http://ollama:11434"
      KH_S3_ENDPOINT: "http://garage:3900"
      KH_S3_BUCKET: kh-blobs
      KH_S3_ACCESS_KEY_FILE: /run/secrets/kh_s3_access_key
      KH_S3_SECRET_KEY_FILE: /run/secrets/kh_s3_secret_key
      KH_CURSOR_KEY_FILE: /run/secrets/kh_cursor_key
      # Set KH_SETUP_SLACK_WEBHOOKS_FILE and mount it here too when a group has slack_channel; without it a panel change on such a group ends with a ! slack hook line and exit 2.
      KH_SETUP_PG_ADMIN_DSN_FILE: /run/secrets/kh_setup_pg_admin_dsn
      KH_SETUP_FORGEJO_ADMIN_TOKEN_FILE: /run/secrets/kh_setup_forgejo_admin_token
      # The panel's own sign-in (not KH_PUBLIC_URL or KH_OIDC_*, which belong to the hub).
      KH_PANEL_PUBLIC_URL: "https://kh-admin.example.com"
      KH_PANEL_OIDC_ISSUER: "https://accounts.google.com"
      KH_PANEL_OIDC_CLIENT_ID: "example-panel-client-id.apps.example.com"
      KH_PANEL_OIDC_CLIENT_SECRET_FILE: /run/secrets/kh_panel_oidc_client_secret
      KH_PANEL_OIDC_ALLOWED_DOMAINS: "example.com"
      KH_PANEL_OIDC_HOSTED_DOMAINS: "example.com"
      KH_PANEL_SESSION_KEY_FILE: /run/secrets/kh_panel_session_key
      KH_PANEL_HUB_URL: "http://knowledge-hub:8080"
    secrets:
      - pg_kh_migrator
      - pg_kh_app
      - pg_kh_indexer
      - kh_hub_bot_token
      - kh_indexer_token
      - kh_webhook_hmac
      - kh_s3_access_key
      - kh_s3_secret_key
      - kh_cursor_key
      - kh_setup_pg_admin_dsn
      - kh_setup_forgejo_admin_token
      - kh_panel_oidc_client_secret
      - kh_panel_session_key
    volumes:
      # Read-write and a directory (the panel writes a lock file and a temporary file next to kh.yaml): the host directory must be writable by the container user, uid 10001.
      - ./config:/etc/kh
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3).read().strip()==b'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Embeddings for bge-m3 on CPU. The `kh` network has no internet access, so `ollama pull` cannot run
  # here: pull the model once with a short-lived container (docs/deployment.md, section "First deploy").
  ollama:
    image: ollama/ollama:0.40.16   # multi-arch, includes linux/arm64
    restart: unless-stopped
    networks: [kh]
    mem_limit: 3g   # bge-m3 (1.2 GB of weights) plus its context; check with `docker stats` on the first rebuild
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "-1"   # keep the model loaded
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ollama-models:/root/.ollama

networks:
  db: {internal: true}
  kh: {internal: true}
  egress: {}   # not internal: allow only the issuer's and the provider's hosts at a proxy or firewall

volumes:
  ollama-models:
    name: kh-ollama-models   # a fixed name, so the one-off pull can mount the same volume

secrets:
  pg_kh_migrator: {file: /etc/stack-secrets/pg_kh_migrator}
  pg_kh_app: {file: /etc/stack-secrets/pg_kh_app}
  pg_kh_indexer: {file: /etc/stack-secrets/pg_kh_indexer}
  kh_hub_bot_token: {file: /etc/stack-secrets/kh_hub_bot_token}
  kh_indexer_token: {file: /etc/stack-secrets/kh_indexer_token}
  kh_webhook_hmac: {file: /etc/stack-secrets/kh_webhook_hmac}
  kh_s3_access_key: {file: /etc/stack-secrets/kh_s3_access_key}
  kh_s3_secret_key: {file: /etc/stack-secrets/kh_s3_secret_key}
  kh_cursor_key: {file: /etc/stack-secrets/kh_cursor_key}
  kh_metrics_token: {file: /etc/stack-secrets/kh_metrics_token}
  kh_oidc_client_secret: {file: /etc/stack-secrets/kh_oidc_client_secret}
  kh_directory_google_key: {file: /etc/stack-secrets/kh_directory_google_key}
  kh_directory_keycloak_secret: {file: /etc/stack-secrets/kh_directory_keycloak_secret}
  kh_setup_pg_admin_dsn: {file: /etc/stack-secrets/kh_setup_pg_admin_dsn}
  kh_setup_forgejo_admin_token: {file: /etc/stack-secrets/kh_setup_forgejo_admin_token}
  kh_panel_oidc_client_secret: {file: /etc/stack-secrets/kh_panel_oidc_client_secret}
  kh_panel_session_key: {file: /etc/stack-secrets/kh_panel_session_key}
