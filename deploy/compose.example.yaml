# Example services for the compose stack. The three networks at the bottom are the ones the stack defines;
# they are repeated here so that `docker compose -f deploy/compose.example.yaml config` passes on its own.
# `db` (Postgres) and `kh` (Forgejo, Garage, Ollama) have no internet access. `pf-kh` is a private
# network shared only with PrivacyFence, which reaches the hub there at http://knowledge-hub:8080/mcp.
# Secrets are files under /run/secrets; this file holds no secret value.
services:
  knowledge-hub:
    # The release image (linux/arm64). Pin the digest in the stack:
    #   docker buildx imagetools inspect ghcr.io/tkcs-lab/knowledge-hub:0.1.0
    image: ghcr.io/tkcs-lab/knowledge-hub:0.1.0
    restart: unless-stopped
    networks: [db, kh, pf-kh]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      KH_ENV: prod
      KH_ALLOWED_HOSTS: "knowledge-hub:8080"
      # Production shape: KH_PF_ISSUER=https://pf.tkcs.name (the address PrivacyFence is served at; no path).
      #   KH_PF_JWKS_URL=http://pf.tkcs.name:8765/upstream-mcp/jwks
      # The JWKS URL reaches PrivacyFence over the private `pf-kh` network, where the PrivacyFence container
      # has the network alias pf.tkcs.name. Its host must be the issuer's host name, or PrivacyFence's Host
      # allowlist answers 400. 8765 is PrivacyFence's default port (PRIVACYFENCE_PORT). Why http is safe:
      # docs/configuration.md, "Claim verification over the private network".
      KH_PF_ISSUER: "https://pf.example.invalid"
      KH_PF_AUDIENCE: "knowledge-hub"   # the `audience` of the upstream in privacyfence-upstream.example.yaml
      KH_PF_JWKS_URL: "http://pf.example.invalid:8765/upstream-mcp/jwks"
      KH_DB_HOST: postgres
      KH_DB_NAME: kh
      KH_DB_MIGRATOR_PASSWORD_FILE: /run/secrets/pg_kh_migrator
      KH_DB_APP_PASSWORD_FILE: /run/secrets/pg_kh_app
      KH_DB_INDEXER_PASSWORD_FILE: /run/secrets/pg_kh_indexer
      KH_CONFIG_FILE: /etc/kh/kh.yaml
      KH_FORGEJO_URL: "http://forgejo:3000"
      KH_FORGEJO_BOT_TOKEN_FILE: /run/secrets/kh_hub_bot_token
      KH_FORGEJO_INDEXER_TOKEN_FILE: /run/secrets/kh_indexer_token
      KH_WEBHOOK_HMAC_FILE: /run/secrets/kh_webhook_hmac
      KH_EMBED_PROVIDER: ollama
      KH_OLLAMA_URL: "http://ollama:11434"
      KH_S3_ENDPOINT: "http://garage:3900"
      KH_S3_BUCKET: kh-blobs
      KH_S3_ACCESS_KEY_FILE: /run/secrets/kh_s3_access_key
      KH_S3_SECRET_KEY_FILE: /run/secrets/kh_s3_secret_key
      KH_CURSOR_KEY_FILE: /run/secrets/kh_cursor_key
      KH_METRICS_TOKEN_FILE: /run/secrets/kh_metrics_token
      KH_PROPOSE_MAX_BYTES: "131072"
      KH_PROPOSE_MAX_OPEN: "20"
      KH_SEARCH_MIN_SIMILARITY: "0"   # off; calibrate per docs/runbook.md "Calibrating the search similarity floor"
    secrets:
      - pg_kh_migrator
      - pg_kh_app
      - pg_kh_indexer
      - kh_hub_bot_token
      - kh_indexer_token
      - kh_webhook_hmac
      - kh_s3_access_key
      - kh_s3_secret_key
      - kh_cursor_key
      - kh_metrics_token
    volumes:
      - ./config:/etc/kh:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read().strip()==b'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Embeddings for bge-m3 on CPU. The `kh` network has no internet access, so `ollama pull` cannot run
  # here: pull the model once with a short-lived container (docs/runbook.md, install step 5).
  ollama:
    image: ollama/ollama:0.40.16   # multi-arch, includes linux/arm64
    restart: unless-stopped
    networks: [kh]
    mem_limit: 3g   # bge-m3 (1.2 GB of weights) plus its context; check with `docker stats` on the first rebuild
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "-1"   # keep the model loaded
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ollama-models:/root/.ollama

networks:
  db: {internal: true}
  kh: {internal: true}
  pf-kh: {internal: true}

volumes:
  ollama-models:
    name: kh-ollama-models   # a fixed name, so the one-off pull can mount the same volume

secrets:
  pg_kh_migrator: {file: /etc/stack-secrets/pg_kh_migrator}
  pg_kh_app: {file: /etc/stack-secrets/pg_kh_app}
  pg_kh_indexer: {file: /etc/stack-secrets/pg_kh_indexer}
  kh_hub_bot_token: {file: /etc/stack-secrets/kh_hub_bot_token}
  kh_indexer_token: {file: /etc/stack-secrets/kh_indexer_token}
  kh_webhook_hmac: {file: /etc/stack-secrets/kh_webhook_hmac}
  kh_s3_access_key: {file: /etc/stack-secrets/kh_s3_access_key}
  kh_s3_secret_key: {file: /etc/stack-secrets/kh_s3_secret_key}
  kh_cursor_key: {file: /etc/stack-secrets/kh_cursor_key}
  kh_metrics_token: {file: /etc/stack-secrets/kh_metrics_token}
